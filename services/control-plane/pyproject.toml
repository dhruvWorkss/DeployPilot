[project]
name = "deploypilot-control-plane"
version = "1.0.0"
description = "DeployPilot control-plane API and incident intelligence"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "sqlalchemy==2.0.35",
  "psycopg[binary]==3.2.2",
  "pydantic-settings==2.5.2",
  "prometheus-client==0.21.0",
  "python-jose[cryptography]==3.3.0",
  "httpx==0.27.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "pytest-cov==5.0.0", "ruff==0.6.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --cov=app --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"] # FastAPI intentionally uses Depends() in parameter defaults.
